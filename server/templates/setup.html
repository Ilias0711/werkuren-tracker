<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Eerste installatie – WerkTracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    :root{--primary:#1e3a5f;--accent:#2196f3}
    body{background:linear-gradient(135deg,#1e3a5f 0%,#2d5c9e 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif}
    .setup-card{background:#fff;border-radius:20px;padding:44px 40px;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
    .brand{text-align:center;margin-bottom:28px}
    .brand .icon{width:64px;height:64px;background:var(--accent);border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:1.8rem;color:#fff}
    .brand h1{font-size:1.5rem;font-weight:800;color:var(--primary);margin:0}
    .brand p{color:#6b7280;font-size:.88rem;margin:4px 0 0}
    .step-badge{background:#e0f2fe;color:#0284c7;font-size:.78rem;font-weight:700;padding:4px 12px;border-radius:20px;display:inline-block;margin-bottom:20px}
    .form-label{font-weight:600;font-size:.88rem;color:#374151}
    .form-control{border:1.5px solid #e5e7eb;border-radius:10px;padding:10px 14px;font-size:.93rem;transition:border .2s}
    .form-control:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(33,150,243,.15)}
    .btn-setup{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px;font-size:1rem;font-weight:700;width:100%;transition:opacity .2s}
    .btn-setup:hover{opacity:.88;color:#fff}
    .error-box{background:#fee2e2;color:#dc2626;border-radius:10px;padding:11px 15px;font-size:.88rem;font-weight:600;margin-bottom:16px}
    .info-box{background:#f0f9ff;color:#0369a1;border-radius:10px;padding:12px 16px;font-size:.85rem;margin-bottom:20px;border:1px solid #bae6fd}
  </style>
</head>
<body>
<div class="setup-card">
  <div class="brand">
    <div class="icon"><i class="bi bi-clock-history"></i></div>
    <h1>WerkTracker</h1>
    <p>Welkom! Stel jouw manager account in</p>
  </div>

  <div class="step-badge"><i class="bi bi-1-circle me-1"></i>Eerste installatie</div>

  <div class="info-box">
    <i class="bi bi-info-circle me-2"></i>
    Dit account geeft je toegang tot <strong>alle medewerkers en gegevens</strong>. Bewaar je wachtwoord goed.
  </div>

  {% if error %}
  <div class="error-box"><i class="bi bi-exclamation-circle me-2"></i>{{ error }}</div>
  {% endif %}

  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Jouw naam</label>
      <input type="text" name="name" class="form-control" placeholder="bijv. Jan de Vries" required autofocus/>
    </div>
    <div class="mb-3">
      <label class="form-label">E-mailadres (manager)</label>
      <input type="email" name="email" class="form-control" placeholder="manager@bedrijf.nl" required/>
    </div>
    <div class="mb-3">
      <label class="form-label">Wachtwoord</label>
      <input type="password" name="password" class="form-control" placeholder="Min. 6 tekens" required/>
    </div>
    <div class="mb-4">
      <label class="form-label">Wachtwoord bevestigen</label>
      <input type="password" name="confirm" class="form-control" placeholder="Herhaal wachtwoord" required/>
    </div>
    <button type="submit" class="btn-setup">
      <i class="bi bi-check-circle me-2"></i>Account aanmaken & starten
    </button>
  </form>
</div>
</body>
</html>
