<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Inloggen – WerkTracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    :root{--primary:#1e3a5f;--accent:#2196f3}
    body{background:linear-gradient(135deg,#1e3a5f 0%,#2d5c9e 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif}
    .login-card{background:#fff;border-radius:20px;padding:44px 40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
    .brand{text-align:center;margin-bottom:32px}
    .brand .icon{width:64px;height:64px;background:var(--accent);border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:1.8rem;color:#fff}
    .brand h1{font-size:1.6rem;font-weight:800;color:var(--primary);margin:0}
    .brand p{color:#6b7280;font-size:.9rem;margin:4px 0 0}
    .form-label{font-weight:600;font-size:.88rem;color:#374151}
    .form-control{border:1.5px solid #e5e7eb;border-radius:10px;padding:11px 14px;font-size:.95rem;transition:border .2s}
    .form-control:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(33,150,243,.15)}
    .btn-login{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px;font-size:1rem;font-weight:700;width:100%;transition:opacity .2s}
    .btn-login:hover{opacity:.88;color:#fff}
    .error-box{background:#fee2e2;color:#dc2626;border-radius:10px;padding:12px 16px;font-size:.88rem;font-weight:600;margin-bottom:18px}
    .input-icon{position:relative}
    .input-icon i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#9ca3af;font-size:1rem}
    .input-icon .form-control{padding-left:38px}
  </style>
</head>
<body>
<div class="login-card">
  <div class="brand">
    <div class="icon"><i class="bi bi-clock-history"></i></div>
    <h1>WerkTracker</h1>
    <p>Log in om door te gaan</p>
  </div>

  {% if error %}
  <div class="error-box"><i class="bi bi-exclamation-circle me-2"></i>{{ error }}</div>
  {% endif %}

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="error-box" style="{% if cat == 'success' %}background:#dcfce7;color:#15803d{% endif %}">
        <i class="bi bi-check-circle me-2"></i>{{ msg }}
      </div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <div class="mb-3">
      <label class="form-label">E-mailadres</label>
      <div class="input-icon">
        <i class="bi bi-envelope"></i>
        <input type="email" name="email" class="form-control" placeholder="naam@bedrijf.nl" required autofocus/>
      </div>
    </div>
    <div class="mb-4">
      <label class="form-label">Wachtwoord</label>
      <div class="input-icon">
        <i class="bi bi-lock"></i>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required/>
      </div>
    </div>
    <button type="submit" class="btn-login">
      <i class="bi bi-box-arrow-in-right me-2"></i>Inloggen
    </button>
  </form>

  <p class="text-center mt-4 mb-0" style="font-size:.8rem;color:#9ca3af">
    <i class="bi bi-shield-check me-1"></i>Beveiligde verbinding
  </p>
</div>
</body>
</html>
